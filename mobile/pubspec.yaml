name: silicium_et_cie
description: Tycoon de l'informatique, de 1975 à 2040.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # IBM Plex, embarqué : le jeu doit s'afficher pareil hors ligne, et les
  # exposants de la notation scientifique manquent aux polices système.
  # Sous licence SIL OFL — voir assets/polices/LICENCE-IBM-Plex.txt.
  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/polices/IBMPlexMono-Regular.ttf
        - asset: assets/polices/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: IBMPlexSans
      fonts:
        - asset: assets/polices/IBMPlexSans-Regular.ttf
        - asset: assets/polices/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/polices/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansCondensed
      fonts:
        - asset: assets/polices/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/polices/IBMPlexSansCondensed-Bold.ttf
          weight: 700
